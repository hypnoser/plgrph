<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polygraph Suite</title>
  
  <!-- Іконка вкладки браузера -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%233a7cfd'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='white' font-family='Arial'%3EP%3C/text%3E%3C/svg%3E">
  
  <!-- Підключення вашого незмінного зовнішнього файлу стилів -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Стилі виключно для нових вкладок (щоб не правити ваш style.css) -->
  <style>
    .suite-tabs-container {
      max-width: 880px; 
      margin: 0 auto 15px auto; 
      display: flex; 
      gap: 10px; 
      border-bottom: 2px solid #ddd; 
      padding-bottom: 0;
    }
    .suite-tab-btn {
      padding: 10px 20px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      color: #666;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
      border-radius: 6px 6px 0 0;
    }
    .suite-tab-btn:hover {
      color: #222;
      background: rgba(128,128,128,0.05);
    }
    .suite-tab-btn.active {
      color: #3a7cfd;
      border-bottom-color: #3a7cfd;
      background: rgba(58,124,253,0.05);
    }
    /* Сховати при друці */
    @media print {
      .suite-tabs-container { display: none !important; }
      .suite-tab-content { display: none !important; }
      .suite-tab-content.active { display: block !important; }
    }
  </style>
</head>
<body>

  <!-- ==========================================
       ЕКРАН АВТОРИЗАЦІЇ (ЗАХИСТ ПАРОЛЕМ)
       ========================================== -->
  <div id="auth-overlay" class="auth-overlay">
    <div class="auth-modal">
      <img src="images/logo.png" alt="PLGRPH Logo" class="auth-logo">
      <h2>Polygraph Suite</h2>
      <p>Введіть пароль для доступу до робочого простору.</p>
      
      <div class="auth-input-group">
        <input type="password" id="auth-password" placeholder="******" autocomplete="off">
        <button id="auth-submit-btn">Увійти</button>
      </div>
      
      <div id="auth-error" class="auth-error-msg" style="display: none;">
        ❌ Невірний пароль. Спробуйте ще раз.
      </div>

      <!-- Посилання для користувачів -->
      <div style="margin-top: 25px; display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; font-size: 14px;">
        <a href="info.html" target="_blank" style="color: #3a7cfd; text-decoration: none; font-weight: 600; transition: opacity 0.2s;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'">📖 Про додаток</a>
        <a href="mailto:plgrph@protonmail.com" style="color: #757575; text-decoration: none; font-weight: 600; transition: color 0.2s;" onmouseover="this.style.color='#3a7cfd'" onmouseout="this.style.color='#757575'">✉️ Контакт для зв'язку</a>
      </div>
    </div>
  </div>

  <!-- ==========================================
       ОСНОВНИЙ ДОДАТОК (ПРИХОВАНИЙ ДО ВВОДУ ПАРОЛЯ)
       ========================================== -->
  <div id="main-app-container" style="display: none;">
    
    <!-- Шапка додатку -->
    <header class="app-header">
      <img src="images/logo.png" alt="PLGRPH" class="app-logo">
      <h1 class="app-title">Polygraph Suite <span style="font-size: 11px; background: #f57c00; color: white; padding: 2px 6px; border-radius: 4px; vertical-align: middle; margin-left: 8px;">BETA</span></h1>
    </header>
    
    <!-- ==========================================
         ПЕРЕМИКАЧ ВКЛАДОК
         ========================================== -->
    <div class="suite-tabs-container">
      <button class="suite-tab-btn active" data-target="tab-ess">ESS-M Calculator v5.0</button>
      <button class="suite-tab-btn" data-target="tab-cit">CIT Calculator</button>
    </div>

    <!-- ==========================================
         ВКЛАДКА 1: ВАШ ОРИГІНАЛЬНИЙ ESS-M
         ========================================== -->
    <div id="tab-ess" class="suite-tab-content active">
      <!-- Сюди ваш script.js буде генерувати інтерфейс -->
      <main id="app"></main>
    </div>

    <!-- ==========================================
         ВКЛАДКА 2: НОВИЙ КАЛЬКУЛЯТОР CIT
         ========================================== -->
    <div id="tab-cit" class="suite-tab-content" style="display: none;">
      <main id="cit-app"></main>
    </div>
    
    <!-- Прихований системний інпут для імпорту JSON файлів (оригінальний) -->
    <input type="file" id="file-import" accept=".json" style="display: none;">
  </div>

  <!-- ==========================================
       ПІДКЛЮЧЕННЯ СКРИПТІВ
       ========================================== -->
  <!-- Ваш незмінний оригінальний файл логіки ESS-M -->
  <script src="script.js"></script>
  
  <!-- Новий файл для логіки CIT -->
  <script src="cit.js"></script>

  <!-- Скрипт перемикання вкладок -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var tabBtns = document.querySelectorAll('.suite-tab-btn');
      var tabContents = document.querySelectorAll('.suite-tab-content');
      
      tabBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          tabBtns.forEach(function(b) { b.classList.remove('active'); });
          tabContents.forEach(function(c) { c.style.display = 'none'; c.classList.remove('active'); });
          
          btn.classList.add('active');
          var targetId = btn.getAttribute('data-target');
          var targetEl = document.getElementById(targetId);
          if(targetEl) {
            targetEl.style.display = 'block';
            targetEl.classList.add('active');
          }
        });
      });
    });
  </script>
</body>
</html>
