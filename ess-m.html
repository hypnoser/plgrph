  <p><strong>ESS-M Calculator v4.2</strong> — це спеціалізований веб-додаток для автоматизованого підрахунку результатів поліграфологічних тестів за емпіричною системою оцінювання ESS-M (Empirical Scoring System - Multinomial).</p>

  const updateDynamicsChart = (wrapper, values, ce) => {
    const svg = ce.dynamicsSvg;
    const textDiv = ce.dynamicsText;
    if (!svg) return;
    svg.innerHTML = '';
    const width = 400, height = 80, centerY = 40;
    const maxVal = 12, minVal = -12;
    const padding = 40;
    const chartWidth = width - padding * 2;
    const zeroLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
    zeroLine.setAttribute("x1", padding); zeroLine.setAttribute("y1", centerY);
    zeroLine.setAttribute("x2", width - padding); zeroLine.setAttribute("y2", centerY);

    svg.appendChild(zeroLine);
    const topLabel = document.createElementNS("http://www.w3.org/2000/svg", "text");
    topLabel.setAttribute("x", width/2); topLabel.setAttribute("y", 12);
    topLabel.setAttribute("text-anchor", "middle"); topLabel.setAttribute("font-size", "8");
    topLabel.setAttribute("fill", "#aaa"); topLabel.textContent = "+ Порівняння (заспокоєння)";
    svg.appendChild(topLabel);
    const bottomLabel = document.createElementNS("http://www.w3.org/2000/svg", "text");
    bottomLabel.setAttribute("x", width/2); bottomLabel.setAttribute("y", height - 2);
    bottomLabel.setAttribute("text-anchor", "middle"); bottomLabel.setAttribute("font-size", "8");
    bottomLabel.setAttribute("fill", "#aaa"); bottomLabel.textContent = "- Релевантні (напруга)";
    svg.appendChild(bottomLabel);
    if (values.length === 0) {
      textDiv.textContent = "Немає даних для аналізу динаміки";
      return;
    }
    const stepX = values.length > 1 ? chartWidth / (values.length - 1) : chartWidth / 2;
    let pathD = "";
    values.forEach((v, i) => {
      const x = padding + (values.length > 1 ? i * stepX : chartWidth / 2);
      const clamped = Math.max(minVal, Math.min(maxVal, v.value));
      const y = centerY - (clamped / maxVal) * 30;
      if (i === 0) pathD += "M " + x + " " + y;
      else pathD += " L " + x + " " + y;
    });
    if (values.length > 1) {
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", pathD); path.setAttribute("fill", "none");
      path.setAttribute("stroke", "#3a7cfd"); path.setAttribute("stroke-width", "2"); path.setAttribute("opacity", "0.5");
      svg.appendChild(path);
    }
    values.forEach((v, i) => {
      const x = padding + (values.length > 1 ? i * stepX : chartWidth / 2);
      const clamped = Math.max(minVal, Math.min(maxVal, v.value));
      const y = centerY - (clamped / maxVal) * 30;
      const radius = Math.max(5, Math.min(10, 5 + Math.abs(v.value) * 0.5));
      let color;
      if (v.value < 0) {
        const intensity = Math.min(1, Math.abs(v.value) / 8);
        const r = Math.floor(211 - intensity * 60);
        const g = Math.floor(47 - intensity * 20);
        const b = Math.floor(47 - intensity * 20);
        color = "rgb(" + r + "," + g + "," + b + ")";
      } else if (v.value > 0) {
        const intensity = Math.min(1, v.value / 8);
        const r = Math.floor(46 - intensity * 20);
        const g = Math.floor(125 - intensity * 40);
        const b = Math.floor(50 - intensity * 20);
        color = "rgb(" + r + "," + g + "," + b + ")";
      } else {
        color = "#999";
      }
      const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      circle.setAttribute("cx", x); circle.setAttribute("cy", y); circle.setAttribute("r", radius);
      circle.setAttribute("fill", color); circle.setAttribute("stroke", "#fff"); circle.setAttribute("stroke-width", "1.5");
      svg.appendChild(circle);
      const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
      label.setAttribute("x", x); label.setAttribute("y", height - 12);
      label.setAttribute("text-anchor", "middle"); label.setAttribute("font-size", "8");
      label.setAttribute("fill", "#666"); label.setAttribute("font-weight", "bold");
      label.textContent = "C" + v.chart;
      svg.appendChild(label);
      const valText = document.createElementNS("http://www.w3.org/2000/svg", "text");
      valText.setAttribute("x", x); valText.setAttribute("y", y - radius - 3);
      valText.setAttribute("text-anchor", "middle"); valText.setAttribute("font-size", "8");
      valText.setAttribute("fill", "#444"); valText.setAttribute("font-weight", "bold");
      valText.textContent = v.value;
      svg.appendChild(valText);
    });
    const vals = values.map(v => v.value);
    const allNegative = vals.every(v => v < 0);
    const allPositive = vals.every(v => v > 0);
    const allZero = vals.every(v => v === 0);
    const firstNeg = vals[0] < 0;

    } else if (allPositive) {

    } else if (firstNeg && lastPos && trend < 0) {

    } else if (vals.some(v => v < 0) && vals.some(v => v > 0)) {
      interpretation = "Нестабільна динаміка: коливання між релевантними питаннями та порівнянням. Можлива протидія або емоційна нестабільність.";
    } else {
      interpretation = "Змішана динаміка: спостерігаються зміни стану респондента між чартами.";

  };

  const calcPneumoESS = (v, n) => {

  const getGrandProbValue = (val) => {
    const v = Math.abs(val);
    if (v >= 20) return "Pr > 99%";
    if (gtProbs[v]) return "Pr ~ " + gtProbs[v] + "%";
    return "p > 0.05";
  };

  const getScreeningProbValue = (val) => {
    if (val <= -12) return "Pr > 99%";

    if (val === -10) return "Pr ~ 98%";
    if (val === -9) return "Pr ~ 97%";
    if (val === -8) return "Pr ~ 95%";
    if (val === -7) return "Pr ~ 92%";
    if (val === -6) return "Pr ~ 89%";
    if (val === -5) return "Pr ~ 85%";
    if (val === -4) return "Pr ~ 79%";
    if (val === -3) return "Pr ~ 73%";
    if (val >= 6) return "Pr > 99%";
    if (val === 5) return "Pr ~ 99%";
    if (val === 4) return "Pr ~ 98%";
    if (val === 3) return "Pr ~ 95%";
    if (val === 2) return "Pr ~ 88%";
    if (val === 1) return "Pr ~ 73%";
    return "p > 0.05";
  };

  const senterProbsMap = new Map([
    [-7, 94.0], [-8, 96.2], [-9, 97.8], [-10, 98.8], [-11, 99.4], [-12, 99.7], [-13, 99.9]
  ]);
  const getSenterProbValue = (val) => {
    const numVal = Number(val);
    if (numVal <= -14) return "Pr > 99.9%";
    if (senterProbsMap.has(numVal)) return "Pr ~ " + senterProbsMap.get(numVal).toFixed(1) + "%";

  const getSpotInfo = (val, testType) => {

    if (testType === "screening") {

    let colHasData = { 1: false, 2: false, 3: false, 4: false };
    const currentTestType = ce.typeRadios.find(r => r.checked)?.value || "screening";
    if (ce.contamWrapper) ce.contamWrapper.style.display = (currentTestType === "screening") ? "inline-flex" : "none";
    const isContamActive = ce.contamToggle?.checked ?? true;
    const chartToggle4 = ce.chartToggles.find(t => t.getAttribute('data-chart') === '4');
    const chartToggle5 = ce.chartToggles.find(t => t.getAttribute('data-chart') === '5');
    const activeCharts = { 1: true, 2: true, 3: true, 4: chartToggle4 ? chartToggle4.checked : true, 5: chartToggle5 ? chartToggle5.checked : true };

    for (let c = 1; c <= 5; c++) {
      const cStr = c.toString();
      const rows = ce.rows.filter(r => r.getAttribute('data-chart-group') === cStr);
      const chartInputs = ce.inputs.filter(i => i.getAttribute('data-chart') === cStr);
      if (!activeCharts[c]) {
        rows.forEach(r => r.classList.add("chart-disabled"));
        chartInputs.forEach(i => i.setAttribute("disabled", "true"));
      } else {
        rows.forEach(r => r.classList.remove("chart-disabled"));
        chartInputs.forEach(i => i.removeAttribute("disabled"));
      }
    }

    const getVal = (chart, col, row) => {
      const key = chart + '_' + col + '_' + row;
      const input = ce.inputsMap[key];
      if (!input || input.disabled) return 0;
      const val = input.value.trim();
      if (val !== "" && val !== "-" && activeCharts[chart]) colHasData[col] = true;
      return (val === "" || val === "-") ? 0 : parseFloat(val) || 0;
    };

    for (let c = 1; c <= 5; c++) {
      let currentChartSum = 0;
      const cStr = c.toString();
      for (let col = 1; col <= 4; col++) {
        const colStr = col.toString();
        const pv = getVal(cStr, colStr, 'pneumo-v');
        const pn = getVal(cStr, colStr, 'pneumo-n');
        const pneumo = calcPneumoESS(pv, pn);
        const spanPneumo = ce.pneumoSums.find(s => s.getAttribute('data-chart') === cStr && s.getAttribute('data-col') === colStr);
        if (spanPneumo) {
          if (pneumo.art) { 
            spanPneumo.textContent = "0 ⚠"; 
            spanPneumo.parentElement.classList.add("bg-artifact"); 
          }
          else { 
            spanPneumo.textContent = pneumo.val; 
            spanPneumo.parentElement.classList.remove("bg-artifact"); 
          }
        }
        const colSum = pneumo.val + getVal(cStr, colStr, 'eda') + getVal(cStr, colStr, 'cardio') + getVal(cStr, colStr, 'ppg');
        if (activeCharts[c]) subtotals[col] += colSum;
        currentChartSum += colSum;
      }
      const spanChartTotal = ce.chartTotals.find(s => s.getAttribute('data-chart') === cStr);
      if (spanChartTotal) {
        spanChartTotal.textContent = activeCharts[c] ? currentChartSum : "—";
        spanChartTotal.parentElement.style.opacity = activeCharts[c] ? "1" : "0.5";
      }
    }

    let spotInfos = {}, hasAnySR = false, minSpotVal = Infinity, activeSpotVals = [];
    for (let col = 1; col <= 4; col++) {
      if (!colHasData[col]) { spotInfos[col] = { status: "N/A", prob: "-", cls: "bg-na" }; continue; }
      const val = subtotals[col];
      activeSpotVals.push(val);
      if (val < minSpotVal) minSpotVal = val;
      let info = getSpotInfo(val, currentTestType);
      spotInfos[col] = info;
      if (info.status === "SR") hasAnySR = true;
    }

    if (currentTestType === "screening" && hasAnySR && isContamActive) {
      for (let col = 1; col <= 4; col++) {
        if (colHasData[col] && spotInfos[col].status === "NSR") {
          spotInfos[col] = { status: "INC", prob: "Блоковано (є SR)", cls: "bg-inc" };
        }
      }
    }

    let grandTotal = 0;
    for (let col = 1; col <= 4; col++) {
      const colStr = col.toString();
      const spanSub = ce.subtotals.find(s => s.getAttribute('data-col') === colStr);
      if (spanSub) spanSub.textContent = colHasData[col] ? subtotals[col] : "-";
      const info = spotInfos[col];
      const cellStatus = ce.statuses.find(s => s.getAttribute('data-col') === colStr);
      if (cellStatus) {
        cellStatus.className = "status-cell " + info.cls;
        cellStatus.innerHTML = (info.status === "N/A" || info.status === "-") ? '<span style="color:#888;">' + info.status + '</span>' : '<span class="status-badge">' + info.status + '</span><span class="prob-text">' + info.prob + '</span>';
      }
      if (colHasData[col]) grandTotal += subtotals[col];
    }

    if (ce.grandTotal) ce.grandTotal.textContent = activeSpotVals.length > 0 ? grandTotal : "0";
    const grandInfo = getGrandProb(grandTotal, activeSpotVals, currentTestType, minSpotVal, hasAnySR);
    if (ce.grandStatus) {
      ce.grandStatus.className = "status-cell " + grandInfo.cls;
      ce.grandStatus.innerHTML = grandInfo.status === "N/A" ? '<span style="color:#888;">Немає даних</span>' : '<span class="status-badge" style="font-size:14px;">' + grandInfo.status + '</span><span class="prob-text" style="font-size:11px;">' + grandInfo.prob + '</span>';
    }

    if (ce.scaleLabels) {
      if (currentTestType === "diagnostic") {
        ce.scaleLabels.innerHTML = '<span style="color: #d32f2f;">◀ SR (-3 і менше)</span><span style="color: #fbc02d;">INC</span><span style="color: #2e7d32;">NSR (+3 і більше) ▶</span>';
      } else {
        ce.scaleLabels.innerHTML = '<span style="color: #d32f2f;">◀ SR (Є Spot ≤ -3)</span><span style="color: #fbc02d;">INC</span><span style="color: #2e7d32;">NSR (Всі ≥ +1) ▶</span>';
      }
    }
    if (ce.scaleMarker) {
      const minVal = -12, maxVal = 12;
      const clamped = Math.max(minVal, Math.min(maxVal, grandTotal));
      const percentage = ((clamped - minVal) / (maxVal - minVal)) * 100;
      ce.scaleMarker.style.left = activeSpotVals.length > 0 ? percentage + "%" : "50%";
    }

    const dynamicsValues = [];
    for (let c = 1; c <= 5; c++) {
      if (activeCharts[c]) {
        const spanChartTotal = ce.chartTotals.find(s => s.getAttribute('data-chart') === c.toString());
        const text = spanChartTotal ? spanChartTotal.textContent : "0";
        const val = text === "—" ? 0 : parseFloat(text) || 0;
        dynamicsValues.push({chart: c, value: val});
      }
    }
    updateDynamicsChart(wrapper, dynamicsValues, ce);
  };

  const createTestTable = (savedData = null) => {
    const currentNumber = testsContainer.querySelectorAll(".ess-test-wrapper").length + 1;
    const uid = Math.random().toString(36).substr(2, 9);
    const wrapper = document.createElement("div");
    wrapper.className = "ess-test-wrapper";

    const rows = [
      { id: 'pneumo-v', label: 'Дихання "В"' }, { id: 'pneumo-n', label: 'Дихання "Н"' },
      { id: 'eda', label: 'ЕДА' }, { id: 'cardio', label: 'Кардіо' }, { id: 'ppg', label: 'ФПГ' }
    ];

    const titleVal = savedData?.title !== undefined ? escapeHtml(savedData.title) : "";
    const typeVal = savedData?.type !== undefined ? escapeHtml(savedData.type) : "screening";
    const formatVal = savedData?.format !== undefined ? escapeHtml(savedData.format) : "N/A";
    const savedQuestions = savedData?.questions || {};
    const radioName = "test_type_" + uid;

    const formatOptions = TEST_FORMATS.map(f => '<option value="' + escapeHtml(f) + '"' + (f === formatVal ? ' selected' : '') + '>' + escapeHtml(f) + '</option>').join('');

    let tableHtml = `
      <div class="ess-test-top-bar">
        <div class="ess-top-bar-left">
          <select class="ess-format-select" title="Формат тестування">` + formatOptions + `</select>
          <div class="ess-type-toggle toggle-type">
            <input type="radio" id="scr_` + uid + `" name="` + radioName + `" value="screening" ` + (typeVal === 'screening' ? 'checked' : '') + ` />
            <label for="scr_` + uid + `">📋 Скринінговий</label>
            <input type="radio" id="diag_` + uid + `" name="` + radioName + `" value="diagnostic" ` + (typeVal === 'diagnostic' ? 'checked' : '') + ` />
            <label for="diag_` + uid + `">🔍 Діагностичний</label>
          </div>
          <button class="ess-btn ess-questions-btn" title="Редагувати питання R1–R4">📝 Питання</button>
          <button class="ess-btn ess-clear-btn" title="Очистити цифри цієї таблиці">Очистити пам'ять</button>
        </div>
        <button class="ess-delete-btn" title="Видалити цей тест">×</button>
      </div>
      <div class="ess-test-title-area">
        <span class="ess-test-num-label">Тест №` + currentNumber + `:</span>
        <input type="text" placeholder="Назва тесту (напр., 3 AFMGQT...)" value="` + titleVal + `" />
      </div>
      
      <div class="ess-table-responsive">
      <table class="ess-table">
        <thead>
          <tr>
            <th style="width: 14%;">ESS</th>
            <th colspan="2" style="width: 19%;" class="ess-th-question" data-th-col="1" title="` + escapeHtml(savedQuestions.R1 || '') + `">R1 (R4)</th>
            <th colspan="2" style="width: 19%;" class="ess-th-question" data-th-col="2" title="` + escapeHtml(savedQuestions.R2 || '') + `">R2 (R5)</th>
            <th colspan="2" style="width: 19%;" class="ess-th-question" data-th-col="3" title="` + escapeHtml(savedQuestions.R3 || '') + `">R3 (R7)</th>
            <th colspan="2" style="width: 19%;" class="ess-th-question" data-th-col="4" title="` + escapeHtml(savedQuestions.R4 || '') + `">R4 (R8)</th>
            <th style="width: 10%;">Динаміка</th>
          </tr>
        </thead>
        <tbody>
    `;

    for (let c = 1; c <= 5; c++) {
      let headerText = "Chart #" + c;
      if (c === 4 || c === 5) {
        const isChecked = (savedData?.chartToggles?.[c] !== undefined) ? (savedData.chartToggles[c] ? "checked" : "") : "checked";
        headerText = '<label class="chart-toggle-label" title="Увімкнути/Вимкнути цей чарт з розрахунку"><input type="checkbox" class="chart-toggle" data-chart="' + c + '" ' + isChecked + '> Chart #' + c + '</label>';
      }
      tableHtml += '<tr data-chart-group="' + c + '"><td colspan="10" class="chart-header">' + headerText + '</td></tr>';
      for (let r = 0; r < rows.length; r++) {
        tableHtml += '<tr data-chart-group="' + c + '"><td class="row-label" data-row-label="' + rows[r].id + '">' + rows[r].label + '</td>';
        for (let col = 1; col <= 4; col++) {
          const cellKey = c + '_' + col + '_' + rows[r].id;
          const cellVal = savedData?.values?.[cellKey] !== undefined ? escapeHtml(savedData.values[cellKey]) : "";
          if (rows[r].id === 'pneumo-v') {
            tableHtml += '<td><input type="number" min="-1" max="1" step="1" data-chart="' + c + '" data-col="' + col + '" data-row="pneumo-v" value="' + cellVal + '"></td>';
            tableHtml += '<td rowspan="2" class="calc-cell"><span data-calc="pneumo-sum" data-chart="' + c + '" data-col="' + col + '">0</span></td>';
          } else if (rows[r].id === 'pneumo-n') {
            tableHtml += '<td><input type="number" min="-1" max="1" step="1" data-chart="' + c + '" data-col="' + col + '" data-row="pneumo-n" value="' + cellVal + '"></td>';
          } else if (rows[r].id === 'eda') {
            tableHtml += '<td colspan="2"><input type="number" min="-2" max="2" step="2" data-chart="' + c + '" data-col="' + col + '" data-row="eda" value="' + cellVal + '"></td>';
          } else {
            tableHtml += '<td colspan="2"><input type="number" min="-1" max="1" step="1" data-chart="' + c + '" data-col="' + col + '" data-row="' + rows[r].id + '" value="' + cellVal + '"></td>';
          }
        }
        if (r === 0) tableHtml += '<td rowspan="5" class="chart-total-cell"><span data-calc="chart-total" data-chart="' + c + '">0</span></td>';
        tableHtml += '</tr>';
      }
    }

    tableHtml += `
      <tr>
        <td rowspan="2" class="total-label" style="text-align:center; padding: 2px;">
          Subtotals<br>
          <label class="contam-toggle-wrapper" style="display: ` + (typeVal === 'screening' ? 'inline-flex' : 'none') + `; align-items: center; justify-content: center; gap: 2px; font-size: 10px; font-weight: normal; cursor: pointer; color: #666; margin-top: 4px;" title="Увімкнути/Вимкнути правило контамінації (блокування NSR при наявності SR)">
            <input type="checkbox" class="contam-toggle" checked style="margin:0; width:12px; height:12px; cursor:pointer;">
            🔒 Контам.
          </label>
        </td>`;
    for (let col = 1; col <= 4; col++) tableHtml += '<td colspan="2" class="status-cell bg-na" data-calc-cell="status" data-col="' + col + '">-</td>';
    tableHtml += '<td rowspan="2" class="calc-cell" style="background:rgba(0,0,0,0.03); font-size:12px; color:#666; line-height: 1.2;">Динаміка<br>чартів</td></tr><tr>';
    for (let col = 1; col <= 4; col++) tableHtml += '<td colspan="2" class="calc-cell"><span data-calc="subtotal" data-col="' + col + '">-</span></td>';
    tableHtml += `</tr>
      <tr>
        <td class="total-label" style="text-align:center;">Grand Total</td>
        <td colspan="6" class="calc-cell" style="font-size: 16px; color: #3a7cfd;"><span data-calc="grand-total">0</span></td>
        <td colspan="3" class="status-cell bg-na" data-calc-cell="grand-status">Немає даних</td>
      </tr>
    </tbody></table>
    </div> <!-- Закриття .ess-table-responsive -->
    
    <div class="ess-scale-container">
      <div class="ess-scale-title">Графічний баланс реактивності (Grand Total)</div>
      <div class="ess-scale-track"><div class="ess-scale-marker">▼</div></div>
      <div class="ess-scale-labels"></div>
    </div>
    <div class="ess-dynamics-container">
      <div class="ess-dynamics-title">Динаміка стану респондента по чартах</div>
      <svg class="ess-dynamics-svg" viewBox="0 0 400 80" preserveAspectRatio="xMidYMid meet">
        <line x1="20" y1="40" x2="380" y2="40" stroke="#ddd" stroke-width="1" stroke-dasharray="4,2"/>
        <text x="200" y="15" text-anchor="middle" font-size="9" fill="#888">+ Порівняння (заспокоєння)</text>
        <text x="200" y="75" text-anchor="middle" font-size="9" fill="#888">- Релевантні (напруга)</text>
      </svg>
      <div class="ess-dynamics-legend">
        <span style="color:#d32f2f; font-size:10px;">● Негативна (релевантні)</span>
        <span style="color:#888; font-size:10px;">● Нейтральна</span>
        <span style="color:#388e3c; font-size:10px;">● Позитивна (порівняння)</span>
      </div>
      <div class="ess-dynamics-text"></div>
    </div>
    <div class="ess-modal-overlay">
      <div class="ess-modal">
        <div class="ess-modal-header">
          <h3>📝 Питання тесту №` + currentNumber + `</h3>
          <button class="ess-modal-close">&times;</button>
        </div>
        <div class="ess-modal-body">
          <label>R1 (Relevant 1 / R4): <input type="text" class="ess-question-input" data-q="R1" value="` + escapeHtml(savedQuestions.R1 || '') + `" placeholder="Введіть текст питання R1..."></label>
          <label>R2 (Relevant 2 / R5): <input type="text" class="ess-question-input" data-q="R2" value="` + escapeHtml(savedQuestions.R2 || '') + `" placeholder="Введіть текст питання R2..."></label>
          <label>R3 (Relevant 3 / R7): <input type="text" class="ess-question-input" data-q="R3" value="` + escapeHtml(savedQuestions.R3 || '') + `" placeholder="Введіть текст питання R3..."></label>
          <label>R4 (Relevant 4 / R8): <input type="text" class="ess-question-input" data-q="R4" value="` + escapeHtml(savedQuestions.R4 || '') + `" placeholder="Введіть текст питання R4..."></label>
        </div>
        <div class="ess-modal-footer">
          <button class="ess-btn ess-modal-save">💾 Зберегти</button>
          <button class="ess-btn ess-modal-cancel">Скасувати</button>
        </div>
      </div>
    </div>
    `;

    wrapper.innerHTML = tableHtml;

    const inputsArray = Array.from(wrapper.querySelectorAll("input[type='number']"));
    const inputsMap = {};
    inputsArray.forEach(i => { inputsMap[i.getAttribute('data-chart') + '_' + i.getAttribute('data-col') + '_' + i.getAttribute('data-row')] = i; });

    const modalOverlay = wrapper.querySelector(".ess-modal-overlay");
    const questionBtn = wrapper.querySelector(".ess-questions-btn");
    const modalClose = wrapper.querySelector(".ess-modal-close");
    const modalSave = wrapper.querySelector(".ess-modal-save");
    const modalCancel = wrapper.querySelector(".ess-modal-cancel");
    const questionInputs = Array.from(wrapper.querySelectorAll(".ess-question-input"));
    const thQuestions = Array.from(wrapper.querySelectorAll(".ess-th-question"));

    const openModal = () => { modalOverlay.classList.add("active"); };
    const closeModal = () => { modalOverlay.classList.remove("active"); };

    const saveQuestions = () => {
      questionInputs.forEach(inp => {
        const qKey = inp.getAttribute('data-q');
        const colNum = qKey.replace('R','');
        const th = thQuestions.find(t => t.getAttribute('data-th-col') === colNum);
        if (th) th.title = inp.value ? qKey + ": " + inp.value : '';
      });
      closeModal();
      markUnsaved();
    };

    questionBtn.addEventListener('click', openModal);
    modalClose.addEventListener('click', closeModal);
    modalCancel.addEventListener('click', closeModal);
    modalSave.addEventListener('click', saveQuestions);
    modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

    wrapper._cachedElements = {
      titleInput: wrapper.querySelector(".ess-test-title-area input[type='text']"),
      formatSelect: wrapper.querySelector(".ess-format-select"),
      typeRadios: Array.from(wrapper.querySelectorAll(".toggle-type input[type='radio']")),
      chartToggles: Array.from(wrapper.querySelectorAll(".chart-toggle")),
      inputs: inputsArray,
      inputsMap: inputsMap,
      questionInputs: questionInputs,
      pneumoSums: Array.from(wrapper.querySelectorAll('[data-calc="pneumo-sum"]')),
      chartTotals: Array.from(wrapper.querySelectorAll('[data-calc="chart-total"]')),
      subtotals: Array.from(wrapper.querySelectorAll('[data-calc="subtotal"]')),
      statuses: Array.from(wrapper.querySelectorAll('[data-calc-cell="status"]')),
      grandTotal: wrapper.querySelector('[data-calc="grand-total"]'),
      grandStatus: wrapper.querySelector('[data-calc-cell="grand-status"]'),
      scaleLabels: wrapper.querySelector(".ess-scale-labels"),
      scaleMarker: wrapper.querySelector(".ess-scale-marker"),
      contamToggle: wrapper.querySelector(".contam-toggle"),
      contamWrapper: wrapper.querySelector(".contam-toggle-wrapper"),
      rows: Array.from(wrapper.querySelectorAll("tr[data-chart-group]")),
      dynamicsSvg: wrapper.querySelector(".ess-dynamics-svg"),
      dynamicsText: wrapper.querySelector(".ess-dynamics-text")
    };

    let calcTimeout;
    const debouncedCalc = () => {
      clearTimeout(calcTimeout);
      calcTimeout = setTimeout(() => { calculateTest(wrapper); markUnsaved(); }, 50);
    };

    wrapper.querySelectorAll('.chart-toggle').forEach(el => el.addEventListener('change', debouncedCalc));
    wrapper.querySelector(".contam-toggle")?.addEventListener("change", () => { calculateTest(wrapper); markUnsaved(); });
    wrapper.querySelector(".ess-test-title-area input[type='text']")?.addEventListener('input', markUnsaved);
    wrapper.querySelectorAll("input[type='radio']").forEach(el => el.addEventListener('change', debouncedCalc));
    wrapper.querySelector(".ess-format-select")?.addEventListener('change', markUnsaved);

    wrapper.querySelector(".ess-delete-btn").addEventListener("click", () => {
      if (confirm("Ви впевнені, що хочете видалити цей тест?")) {
        wrapper.remove();
        Array.from(testsContainer.querySelectorAll(".ess-test-wrapper")).forEach((w, idx) => {
          w.querySelector(".ess-test-num-label").textContent = "Тест №" + (idx + 1) + ":";
        });
        markUnsaved();
      }
    });

    wrapper.querySelector(".ess-clear-btn").addEventListener("click", () => {
      if (confirm("Очистити всі введені цифри в цій таблиці та ПІБ респондента?")) {
        wrapper._cachedElements.inputs.forEach(i => { if (!i.disabled) i.value = ""; });
        respondentInput.value = ""; // Очищує поле ПІБ
        debouncedCalc();
      }
    });

    wrapper.addEventListener('input', (e) => {
      const el = e.target;
      if (el.tagName === 'INPUT' && el.type === 'number') {
        const val = el.value.trim();
        if (val !== "" && val !== "-") {
          const num = Number(val);
          if (el.getAttribute('data-row') === 'eda' && ![-2, 0, 2].includes(num)) el.value = "";
          else if (el.getAttribute('data-row') !== 'eda' && ![-1, 0, 1].includes(num)) el.value = "";
        }
        debouncedCalc();
      }
    });

    wrapper.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' && e.target.type === 'number') {
        const currentInput = e.target;
        if (e.key === '-' || e.key === 'Subtract' || e.code === 'Minus' || e.code === 'NumpadSubtract') {
          e.preventDefault();
          currentInput.value = (currentInput.getAttribute('data-row') === 'eda') ? "-2" : "-1";
          debouncedCalc();
        } else if (e.key === 'Enter') {
          e.preventDefault();
          const activeInputs = wrapper._cachedElements.inputs.filter(i => !i.disabled);
          let nextInput = null;
          for (let i = activeInputs.indexOf(currentInput) + 1; i < activeInputs.length; i++) {
            if (activeInputs[i].getAttribute('data-col') === currentInput.getAttribute('data-col')) { nextInput = activeInputs[i]; break; }
          }
          if (nextInput) { nextInput.focus(); nextInput.select(); }
        }
      }
    });

    testsContainer.appendChild(wrapper);
    calculateTest(wrapper);
  };

  addBtnBottom.addEventListener("click", () => { createTestTable(); markUnsaved(); });

  const init = () => {
    let loadedData = { respondentName: "", tests: [] };
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        loadedData = parseStateData(parsed);
      }
    } catch (e) {
      console.error("Помилка читання localStorage:", e);
      showError("Помилка завантаження даних з localStorage. Почато з порожньої таблиці.");
    }
    
    // Встановлення ПІБ
    respondentInput.value = loadedData.respondentName || "";

    // Створення тестів
    if (loadedData.tests && loadedData.tests.length > 0) {
      loadedData.tests.forEach(data => createTestTable(data));
    } else {
      createTestTable();
    }
    
    // Початкова фіксація стану для історії
    isRestoringHistory = false;
    recordState();
  };

  init();
</script>
</body>
</html>
