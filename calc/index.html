<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESS-M Calculator v5.0</title>
  
  <!-- Іконка вкладки браузера -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%233a7cfd'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='white' font-family='Arial'%3EE%3C/text%3E%3C/svg%3E">
  
  <!-- Підключення зовнішнього файлу стилів -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ==========================================
       ЕКРАН АВТОРИЗАЦІЇ (ЗАХИСТ ПАРОЛЕМ)
       ========================================== -->
  <div id="auth-overlay" class="auth-overlay">
    <div class="auth-modal">
      <img src="images/logo.png" alt="PLGRPH Logo" class="auth-logo">
      <h2>ESS-M Calculator v5.0</h2>
      <p>Введіть пароль для доступу до калькулятора.</p>
      
      <div class="auth-input-group">
        <input type="password" id="auth-password" placeholder="******" autocomplete="off">
        <button id="auth-submit-btn">Увійти</button>
      </div>
      
      <div id="auth-error" class="auth-error-msg" style="display: none;">
        ❌ Невірний пароль. Спробуйте ще раз.
      </div>

      <!-- Посилання для користувачів -->
      <div style="margin-top: 25px; display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; font-size: 14px;">
        <a href="info.html" target="_blank" style="color: #3a7cfd; text-decoration: none; font-weight: 600; transition: opacity 0.2s;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'">📖 Про калькулятор</a>
        <a href="mailto:plgrph@protonmail.com" style="color: #757575; text-decoration: none; font-weight: 600; transition: color 0.2s;" onmouseover="this.style.color='#3a7cfd'" onmouseout="this.style.color='#757575'">✉️ Контакт для зв'язку</a>
      </div>
    </div>
  </div>

  <!-- ==========================================
       ОСНОВНИЙ ДОДАТОК (ПРИХОВАНИЙ ДО ВВОДУ ПАРОЛЯ)
       ========================================== -->
  <div id="main-app-container" style="display: none;">
    
    <!-- Шапка додатку -->
    <header class="app-header">
      <img src="images/logo.png" alt="PLGRPH" class="app-logo">
      <h1 class="app-title">ESS-M Calculator</h1>
    </header>
    
    <!-- Сюди скрипт буде генерувати інтерфейс -->
    <main id="app"></main>
    
    <!-- Прихований системний інпут для імпорту JSON файлів -->
    <input type="file" id="file-import" accept=".json" style="display: none;">
  </div>

  <!-- Підключення зовнішнього файлу логіки -->
  <script src="script.js"></script>

</body>
</html>
