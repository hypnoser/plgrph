<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polygraph Suite (ESS-M & CIT) - Beta</title>
  
  <!-- Оновлена іконка додатку -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%233a7cfd'/%3E%3Ctext x='50' y='68' font-size='45' text-anchor='middle' fill='white' font-family='Arial'%3EPLG%3C/text%3E%3C/svg%3E">
  
  <!-- Єдиний файл стилів -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ==========================================
       ЕКРАН АВТОРИЗАЦІЇ
       ========================================== -->
  <div id="auth-overlay" class="auth-overlay">
    <div class="auth-modal">
      <div class="auth-logo">🛡️</div>
      <h2>Polygraph Suite Beta</h2>
      <p>Введіть пароль для доступу до робочого простору.</p>
      
      <div class="auth-input-group">
        <input type="password" id="auth-password" placeholder="******" autocomplete="off">
        <button id="auth-submit-btn">Увійти</button>
      </div>
      
      <div id="auth-error" class="auth-error-msg" style="display: none;">
        ❌ Невірний пароль. Спробуйте ще раз.
      </div>
    </div>
  </div>

  <!-- ==========================================
       ОСНОВНИЙ РОБОЧИЙ ПРОСТІР
       ========================================== -->
  <div id="main-app-container" style="display: none;">
    
    <!-- Шапка додатку -->
    <header class="app-header">
      <div class="app-logo-text">PLG</div>
      <h1 class="app-title">Polygraph Suite <span class="beta-badge">BETA</span></h1>
    </header>
    
    <main class="main-workspace">
      
      <!-- Загальний Тулбар інструментів -->
      <div class="global-toolbar">
        <button class="toolbar-btn" id="btn-save" title="Зберегти" aria-label="Зберегти">💾</button>
        <div class="toolbar-sep"></div>
        <button class="toolbar-btn" id="btn-open" title="Відкрити (.json)" aria-label="Відкрити">📂</button>
        <button class="toolbar-btn" id="btn-save-json" title="Експорт (.json)" aria-label="Завантажити JSON">📥</button>
        <div class="toolbar-sep"></div>
        <button class="toolbar-btn" id="btn-markdown" title="Експорт у Markdown (.md)" aria-label="Експорт Markdown">📝</button>
        <button class="toolbar-btn" id="btn-print" title="Експорт PDF / Друк" aria-label="Друк">🖨️</button>
        <button class="toolbar-btn danger-btn" id="btn-clear-all" title="Очистити всі дані" aria-label="Очистити все">🗑️</button>
        <div class="toolbar-sep"></div>
        <button class="toolbar-btn" id="btn-help" title="Інструкції користувача" aria-label="Довідка">❓</button>
        
        <div class="save-status" id="save-status">🟢 Дані збережено</div>
      </div>

      <!-- Загальний Блок Респондента -->
      <div class="respondent-area">
        <div class="name-wrapper">
          <span class="respondent-label">П.І.Б. респондента:</span>
          <input type="text" id="respondent-name" placeholder="Введіть прізвище, ім'я та по батькові..." autocomplete="off" spellcheck="false">
        </div>
        <div class="date-wrapper">
          <span class="respondent-label">📅 Дата:</span>
          <input type="date" id="exam-date" class="date-input">
        </div>
      </div>

      <!-- Перемикач вкладок (Tabs) -->
      <div class="tabs-container">
        <button class="tab-btn active" data-tab="ess-workspace">ESS-M (Скринінг / Діагностика)</button>
        <button class="tab-btn" data-tab="cit-workspace">CIT (Прихована інформація)</button>
      </div>

      <!-- ==========================================
           ВКЛАДКА 1: ESS-M
           ========================================== -->
      <div id="ess-workspace" class="tab-content active">
        <!-- Сюди ess.js буде динамічно додавати таблиці -->
        <div id="ess-tests-container"></div>
        <button id="btn-add-ess" class="add-module-btn">+ Додати обрахунок ESS-M</button>
      </div>

      <!-- ==========================================
           ВКЛАДКА 2: CIT (Lykken)
           ========================================== -->
      <div id="cit-workspace" class="tab-content">
        <!-- Сюди cit.js буде динамічно додавати блоки досліджень -->
        <div id="cit-blocks-container"></div>
        <button id="btn-add-cit-block" class="add-module-btn">+ Додати нове дослідження CIT</button>
      </div>

    </main>
    
    <!-- Прихований інпут для завантаження файлів -->
    <input type="file" id="file-import" accept=".json" style="display: none;">
  </div>

  <!-- ==========================================
       ПІДКЛЮЧЕННЯ СКРИПТІВ
       ========================================== -->
  <!-- Глобальний об'єкт для комунікації між модулями -->
  <script>
    window.PolygraphApp = {
      isUnsaved: false,
      markUnsaved: function() {}, // Буде ініціалізовано в app.js
      performSave: function() {}  // Буде ініціалізовано в app.js
    };
  </script>
  
  <!-- 1. Ядро додатку (Авторизація, Вкладки, Експорт файлів) -->
  <script src="app.js"></script>
  
  <!-- 2. Модуль ESS-M (Математика та рендер таблиць) -->
  <script src="ess.js"></script>
  
  <!-- 3. Модуль CIT (Математика Ліккена, матриці ймовірностей) -->
  <script src="cit.js"></script>

</body>
</html>
