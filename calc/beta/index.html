<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polygraph Suite</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%233a7cfd'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='white' font-family='Arial'%3EP%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ЕКРАН АВТОРИЗАЦІЇ -->
  <div id="auth-overlay" class="auth-overlay">
    <div class="auth-modal">
      <img src="images/logo.png" alt="PLGRPH Logo" class="auth-logo">
      <h2>Polygraph Suite</h2>
      <p>Введіть пароль для доступу до робочого простору.</p>
      <div class="auth-input-group">
        <input type="password" id="auth-password" placeholder="******" autocomplete="off">
        <button id="auth-submit-btn">Увійти</button>
      </div>
      <div id="auth-error" class="auth-error-msg" style="display: none;">
        ❌ Невірний пароль. Спробуйте ще раз.
      </div>
      <div style="margin-top: 25px; display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; font-size: 14px;">
        <a href="info.html" target="_blank" style="color: #3a7cfd; text-decoration: none; font-weight: 600;">📖 Про додаток</a>
        <a href="mailto:plgrph@protonmail.com" style="color: #757575; text-decoration: none; font-weight: 600;">✉️ Контакт</a>
      </div>
    </div>
  </div>

  <!-- ОСНОВНИЙ ДОДАТОК -->
  <div id="main-app-container" style="display: none;">
    <header class="app-header">
      <img src="images/logo.png" alt="PLGRPH" class="app-logo">
      <h1 class="app-title">Polygraph Suite <span style="font-size: 11px; background: #f57c00; color: white; padding: 2px 6px; border-radius: 4px; vertical-align: middle; margin-left: 8px;">BETA</span></h1>
    </header>
    
    <!-- ЄДИНЕ МЕНЮ ТА П.І.Б. ДЛЯ ВСІХ ВКЛАДОК -->
    <div class="suite-toolbar-area">
      <div class="ess-toolbar" id="global-toolbar">
        <button class="ess-toolbar-btn" id="g-save" title="Зберегти">💾</button>
        <div class="ess-toolbar-sep"></div>
        <button class="ess-toolbar-btn" id="g-open" title="Відкрити (.json)">📂</button>
        <button class="ess-toolbar-btn" id="g-save-json" title="Зберегти (.json)">📥</button>
        <div class="ess-toolbar-sep"></div>
        <button class="ess-toolbar-btn" id="g-markdown" title="Експорт у Markdown (.md)">📝</button>
        <button class="ess-toolbar-btn" id="g-print" title="Друк / PDF">🖨️</button>
        <button class="ess-toolbar-btn danger-btn" id="g-clear" title="Очистити все">🗑️</button>
        <div class="ess-toolbar-sep"></div>
        <button class="ess-toolbar-btn" id="g-help" title="Довідка">❓</button>
        <div class="ess-save-status" id="g-status">🟢 Дані збережено</div>
      </div>
      <div class="ess-respondent-area">
        <div class="ess-name-wrapper">
          <span class="ess-respondent-label">П.І.Б. респондента:</span>
          <input type="text" id="global-resp-name" placeholder="Введіть прізвище, ім'я та по батькові..." autocomplete="off" spellcheck="false">
        </div>
        <div class="ess-date-wrapper">
          <span class="ess-respondent-label">📅 Дата:</span>
          <input type="date" id="global-exam-date" class="ess-date-input">
        </div>
      </div>
    </div>

    <!-- ПЕРЕМИКАЧ ВКЛАДОК -->
    <div class="suite-tabs-container">
      <button class="suite-tab-btn active" data-target="tab-ess">ESS-M</button>
      <button class="suite-tab-btn" data-target="tab-cit">CIT</button>
    </div>

    <!-- КОНТЕЙНЕРИ МЕТОДИК -->
    <div id="tab-ess" class="suite-tab-content active"><main id="app"></main></div>
    <div id="tab-cit" class="suite-tab-content" style="display: none;"><main id="cit-app"></main></div>
    <input type="file" id="file-import" accept=".json" style="display: none;">
  </div>

  <script src="ess.js"></script>
  <script src="cit.js"></script>
  <script src="app.js"></script>
</body>
</html>
